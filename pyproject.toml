[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "btc-quant-trader"
version = "0.1.0"
description = "Research-first BTC/USDT market-data infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic==1.14.1",
  "asyncpg==0.30.0",
  "fastapi==0.115.8",
  "httpx==0.28.1",
  "numpy==2.2.2",
  "pandas==2.2.3",
  "pyarrow==19.0.0",
  "pydantic-settings==2.7.1",
  "redis==5.2.1",
  "sqlalchemy==2.0.38",
  "uvicorn[standard]==0.34.0",
  "websockets==14.2",
]

[project.optional-dependencies]
dev = [
  "aiosqlite==0.21.0",
  "mypy==1.15.0",
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["backend/tests", "backend/alembic"]

[tool.coverage.run]
source = ["backend/app"]
branch = true

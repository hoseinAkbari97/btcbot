services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btcbot
      POSTGRES_USER: btcbot
      POSTGRES_PASSWORD: btcbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btcbot -d btcbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://btcbot:btcbot@postgres:5432/btcbot}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-kraken}
      KRAKEN_REST_BASE_URL: ${KRAKEN_REST_BASE_URL:-https://api.kraken.com}
      KRAKEN_WS_BASE_URL: ${KRAKEN_WS_BASE_URL:-wss://ws.kraken.com/v2}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://api.binance.com}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-wss://stream.binance.com:9443/ws}
      RAW_DATA_PATH: /app/data/raw
      PARQUET_DATA_PATH: /app/data/parquet
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
      SCHEDULER_SYMBOL: ${SCHEDULER_SYMBOL:-BTCUSDT}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
  redis_data:

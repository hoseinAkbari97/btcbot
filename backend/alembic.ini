[alembic]
script_location = alembic
file_template = %%_rev%%_%%slug%%
timezone = UTC

[post_write_hooks]
file_template = %%rev%%_%%slug%%.py
# commands to run after each revision
# hooks: https://alembic.sqlalchemy.org/en/latest/post_write_hooks.html#configuration
# post_write_hooks_config: https://alembic.sqlalchemy.org/en/latest/post_write_hooks.html#post-write-hooks-configuration

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
formatter = generic
args = (sys.stderr,)

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S